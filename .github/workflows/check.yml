name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Static checks, generated files up to date, the runtime tests, and both adapters against stand-ins
        run: python3 smoke_test.py
      - name: The tool itself, driven in headless Chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.49.1
          PLAYWRIGHT_CORE="$PWD/node_modules/playwright-core" node tests/browser_test.js
