name: sync persistable
# The persistablejs repo pushes new copies of its client and store code to the branch sync/persistable whenever
# they change there. This checks the copies and opens the pull request; it never touches main.
on:
  push:
    branches: [sync/persistable]
permissions:
  contents: read
  pull-requests: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      # the smoke test below runs code from the pushed branch, so the token is not left in .git/config for it to find
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The smoke test passes on the new copies
        run: python3 smoke_test.py
      - name: Open the pull request, unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh pr list --head sync/persistable --state open --json number -q '.[].number')" ]; then
            gh pr create --head sync/persistable --base main \
              --title "Update the Persistable.js copies" \
              --body "$(git log -1 --pretty=%s). Copied unchanged by the persistablejs sync workflow. The smoke test passed on the copies; the browser scenarios were not run."
          fi
