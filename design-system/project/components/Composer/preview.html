<!-- @dsCard group="Cards" height=445 width=880 -->
<!doctype html>
<meta charset="utf-8">
<style>
html,body{margin:0;background:var(--cm-base);color:var(--cm-text)}
.ds{display:flex;flex-wrap:wrap;gap:16px;padding:16px;align-items:flex-start}
.ds figure{margin:0;display:flex;flex-direction:column;gap:var(--cm-s2)}
.ds figcaption{font-size:var(--cm-fs-meta);color:var(--cm-text-meta)}
.stage{padding:var(--cm-s4);border:1px dashed var(--cm-border);border-radius:var(--cm-r-md);display:flex;align-items:flex-start;justify-content:center;min-height:64px;position:relative}
.stage{padding:var(--cm-s4);border:1px dashed var(--cm-border);border-radius:var(--cm-r-md);display:flex;align-items:flex-start;justify-content:center;min-height:64px;position:relative}
.stage.page{background:var(--cm-strip)}
.stage .pin,.stage .card,.stage aside,.stage .dock,.stage .note-banner{position:relative;left:auto;top:auto;right:auto;bottom:auto;transform:none}
.stage .pin{margin:0}
.stage .toast{position:relative;left:auto;bottom:auto;translate:none}
.stage .quoted{background:var(--cm-selected);color:var(--cm-text)}
.stage .menu{position:relative;top:auto;right:auto}
.stage .thread .menu{position:absolute;top:40px;right:8px}
.stage .dock{transform:none!important}
.stage aside{height:300px;width:300px;transition:none}
.stage aside.half{transform:translateX(35%);opacity:.9}
.stage:has(aside.half){overflow:hidden}
.stage .pin{flex:none}
.stage .scroll{padding:0;flex:none;overflow:visible;width:290px}
.stage .frozen{animation-play-state:paused!important;animation-delay:-.12s!important}
.stage .leaving.frozen{animation-delay:-.05s!important}
.stage .thread.short{max-height:250px}
.stage .thread.adrift{margin:0;height:auto;box-shadow:var(--cm-elev-3)}
.stage .ghostnote{color:var(--cm-text-hint);font-size:var(--cm-fs-meta);align-self:center}
.stage .target{position:relative;padding:var(--cm-s2) var(--cm-s3);color:var(--cm-text-body)}
.stage .target .wash{position:absolute;inset:0;transition:none}
.stage .plain{padding:var(--cm-s2) var(--cm-s3);color:var(--cm-text-body)}
</style>
<div class="ds">
<figure><div class="stage"><div class="card composer" role="dialog" aria-label="New note"><div class="strip"><div class="compose"><span class="face" aria-hidden="true" style="--face: var(--cm-face-0); --face-ink: var(--cm-face-0-ink); --av: var(--cm-av-0); --av-ink: var(--cm-av-0-ink);">BN</span><textarea rows="1" maxlength="1000" aria-label="New note text" placeholder="Leave a note…" tabindex="0"></textarea><button class="send" type="button" disabled="" aria-label="Save note" title="Save note"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-6.5zM12 13.5 20 4"></path></svg></span></button></div><div class="count" aria-live="polite"></div><div class="err" role="alert"></div></div></div></div><figcaption>New note</figcaption></figure>
<figure><div class="stage"><div class="card composer" role="dialog" aria-label="New note"><div class="strip"><div class="compose"><span class="face" aria-hidden="true" style="--face: var(--cm-face-0); --face-ink: var(--cm-face-0-ink); --av: var(--cm-av-0); --av-ink: var(--cm-av-0-ink);">BN</span><textarea rows="1" maxlength="1000" aria-label="New note text" placeholder="Leave a note…" tabindex="0" class="is-focus"></textarea><button class="send" type="button" disabled="" aria-label="Save note" title="Save note"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-6.5zM12 13.5 20 4"></path></svg></span></button></div><div class="count" aria-live="polite"></div><div class="err" role="alert"></div></div></div></div><figcaption>Focused</figcaption></figure>
<figure><div class="stage"><div class="card composer" role="dialog" aria-label="New note"><div class="strip"><div class="compose"><span class="face" aria-hidden="true" style="--face: var(--cm-face-0); --face-ink: var(--cm-face-0-ink); --av: var(--cm-av-0); --av-ink: var(--cm-av-0-ink);">BN</span><textarea rows="1" maxlength="1000" aria-label="New note text" placeholder="Leave a note…" tabindex="0" class="is-focus"></textarea><button class="send" type="button" aria-label="Save note" title="Save note"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-6.5zM12 13.5 20 4"></path></svg></span></button></div><div class="count" aria-live="polite"></div><div class="err" role="alert"></div></div></div></div><figcaption>Ready to send</figcaption></figure>
<figure><div class="stage"><div class="card composer toolong" role="dialog" aria-label="New note"><div class="strip"><div class="compose"><span class="face" aria-hidden="true" style="--face: var(--cm-face-0); --face-ink: var(--cm-face-0-ink); --av: var(--cm-av-0); --av-ink: var(--cm-av-0-ink);">BN</span><textarea rows="1" maxlength="1000" aria-label="New note text" placeholder="Leave a note…" tabindex="0"></textarea><button class="send" type="button" aria-label="Save note" title="Save note"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-6.5zM12 13.5 20 4"></path></svg></span></button></div><div class="count" aria-live="polite">1000 / 1000</div><div class="err" role="alert"></div></div></div></div><figcaption>Too long</figcaption></figure>
<figure><div class="stage"><div class="card composer failed" role="dialog" aria-label="New note"><div class="strip"><div class="compose"><span class="face" aria-hidden="true" style="--face: var(--cm-face-0); --face-ink: var(--cm-face-0-ink); --av: var(--cm-av-0); --av-ink: var(--cm-av-0-ink);">BN</span><textarea rows="1" maxlength="1000" aria-label="New note text" placeholder="Leave a note…" tabindex="0"></textarea><button class="send" type="button" aria-label="Save note" title="Save note"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-6.5zM12 13.5 20 4"></path></svg></span></button></div><div class="count" aria-live="polite"></div><div class="err" role="alert">Could not save this note. Try again.</div></div></div></div><figcaption>Save failed</figcaption></figure>
</div>
