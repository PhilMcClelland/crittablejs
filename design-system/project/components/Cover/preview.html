<!-- @dsCard height=288 -->
<!doctype html>
<meta charset="utf-8">
<style>
html,body{margin:0;background:var(--cm-base)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;font-family:var(--font-sans)}
.cover svg{position:absolute;inset:0}
.words{position:absolute;left:32px;bottom:28px;width:440px}
.name{margin:0;font-size:64px;line-height:.95;font-weight:600;letter-spacing:-.02em;color:var(--cm-text)}
.tag{margin:16px 0 0;font-size:13px;line-height:1.45;color:var(--cm-text-meta)}
.hl{fill:var(--cm-accent)} .ink{fill:var(--cm-text)} .teal{fill:var(--cm-av-0)} .deep{fill:var(--cm-accent-deep)}
.pinink{fill:var(--cm-pin-ink)} .paper{fill:var(--cm-pin-paper)}
.lg{rx:var(--cm-r-lg)} .tip{rx:var(--cm-r-tip)}
</style>
<div class="cover">
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!-- blocks: cm-accent 240x192 (s6 x10 by x8), cm-text 144x144 bleeding right, cm-av-0 96x96, cm-accent-deep 96x96 bleeding bottom
     arrangement: one tall highlighter slab with three satellites, staggered, right of x=480
     pattern: the literal motif. The README's second rule is one sharp corner that points at the anchor, so the units are pins: discs with a sharp lower-left corner, twelve of them
     steps and radii: pitch 48 (s6 x2), pin 32 with rx 16 (half its side), block corners cm-r-lg, sharp corners cm-r-tip -->
<rect class="hl lg" x="560" y="0" width="240" height="192"/><rect class="hl tip" x="560" y="164" width="28" height="28"/><rect class="hl" x="560" y="0" width="240" height="14"/>
<rect class="ink lg" x="816" y="48" width="160" height="144"/><rect class="ink tip" x="816" y="164" width="28" height="28"/>
<rect class="teal lg" x="480" y="96" width="64" height="96"/><rect class="teal tip" x="480" y="164" width="28" height="28"/>
<rect class="deep lg" x="816" y="208" width="96" height="96"/>
<g class="pinink">
<rect x="584" y="32" width="32" height="32" rx="16"/><rect class="tip" x="584" y="48" width="16" height="16"/>
<rect x="632" y="32" width="32" height="32" rx="16"/><rect class="tip" x="632" y="48" width="16" height="16"/>
<rect x="680" y="32" width="32" height="32" rx="16"/><rect class="tip" x="680" y="48" width="16" height="16"/>
<rect x="728" y="32" width="32" height="32" rx="16"/><rect class="tip" x="728" y="48" width="16" height="16"/>
<rect x="584" y="80" width="32" height="32" rx="16"/><rect class="tip" x="584" y="96" width="16" height="16"/>
<rect x="632" y="80" width="32" height="32" rx="16"/><rect class="tip" x="632" y="96" width="16" height="16"/>
<rect x="728" y="80" width="32" height="32" rx="16"/><rect class="tip" x="728" y="96" width="16" height="16"/>
<rect x="584" y="128" width="32" height="32" rx="16"/><rect class="tip" x="584" y="144" width="16" height="16"/>
<rect x="632" y="128" width="32" height="32" rx="16"/><rect class="tip" x="632" y="144" width="16" height="16"/>
<rect x="680" y="128" width="32" height="32" rx="16"/><rect class="tip" x="680" y="144" width="16" height="16"/>
<rect x="728" y="128" width="32" height="32" rx="16"/><rect class="tip" x="728" y="144" width="16" height="16"/>
</g>
<g class="paper"><rect x="680" y="80" width="32" height="32" rx="16"/><rect class="tip" x="680" y="96" width="16" height="16"/></g>
</svg>
<div class="words"><p class="name">Ink and<br>Highlighter</p><p class="tag">Notes pinned to the page. Yellow marks the spot; ink does the talking.</p></div>
</div>
