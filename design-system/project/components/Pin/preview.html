<!doctype html>
<meta charset="utf-8">
<style>
html,body{margin:0;background:var(--cm-base);color:var(--cm-text)}
.ds{display:flex;flex-wrap:wrap;gap:16px;padding:16px;align-items:flex-start}
.ds figure{margin:0;display:flex;flex-direction:column;gap:var(--cm-s2)}
.ds figcaption{font-size:var(--cm-fs-meta);color:var(--cm-text-meta)}
.stage{padding:var(--cm-s4);border:1px dashed var(--cm-border);border-radius:var(--cm-r-md);display:flex;align-items:flex-start;justify-content:center;min-height:64px;position:relative}
.stage{padding:var(--cm-s4);border:1px dashed var(--cm-border);border-radius:var(--cm-r-md);display:flex;align-items:flex-start;justify-content:center;min-height:64px;position:relative}
.stage.page{background:var(--cm-strip)}
.stage .pin,.stage .card,.stage aside,.stage .dock,.stage .note-banner{position:relative;left:auto;top:auto;right:auto;bottom:auto;transform:none}
.stage .pin{margin:0}
.stage .toast{position:relative;left:auto;bottom:auto;translate:none}
.stage .quoted{background:var(--cm-selected);color:var(--cm-text)}
.stage .menu{position:relative;top:auto;right:auto}
.stage .thread .menu{position:absolute;top:40px;right:8px}
.stage .dock{transform:none!important}
.stage aside{height:300px;width:300px;transition:none}
.stage aside.half{transform:translateX(35%);opacity:.9}
.stage:has(aside.half){overflow:hidden}
.stage .pin{flex:none}
.stage .scroll{padding:0;flex:none;overflow:visible;width:290px}
.stage .frozen{animation-play-state:paused!important;animation-delay:-.12s!important}
.stage .leaving.frozen{animation-delay:-.05s!important}
.stage .thread.short{max-height:250px}
.stage .thread.adrift{margin:0;height:auto;box-shadow:var(--cm-elev-3)}
.stage .ghostnote{color:var(--cm-text-hint);font-size:var(--cm-fs-meta);align-self:center}
.stage .target{position:relative;padding:var(--cm-s2) var(--cm-s3);color:var(--cm-text-body)}
.stage .target .wash{position:absolute;inset:0;transition:none}
.stage .plain{padding:var(--cm-s2) var(--cm-s3);color:var(--cm-text-body)}
</style>
<div class="ds">
<figure><div class="stage page"><button class="pin draft" type="button">+</button></div><figcaption>Draft</figcaption></figure>
<figure><div class="stage page"><button class="pin" type="button" aria-label="Note 4 by Rowan Vale, 0 replies" aria-expanded="false"><span class="face" aria-hidden="true" style="--face: var(--cm-face-0); --face-ink: var(--cm-face-0-ink); --av: var(--cm-av-0); --av-ink: var(--cm-av-0-ink);">RV</span></button></div><figcaption>Rest</figcaption></figure>
<figure><div class="stage page"><button class="pin" type="button" data-unread="" aria-label="Note 4 by Ash Moor, unread, 0 replies" aria-expanded="false"><span class="face" aria-hidden="true" style="--face: var(--cm-face-2); --face-ink: var(--cm-face-2-ink); --av: var(--cm-av-2); --av-ink: var(--cm-av-2-ink);">AM</span></button></div><figcaption>Unread</figcaption></figure>
<figure><div class="stage page"><button class="pin" type="button" aria-label="Note 4 by Rowan Vale, 0 replies" aria-expanded="true"><span class="face" aria-hidden="true" style="--face: var(--cm-face-0); --face-ink: var(--cm-face-0-ink); --av: var(--cm-av-0); --av-ink: var(--cm-av-0-ink);">RV</span></button></div><figcaption>Open</figcaption></figure>
<figure><div class="stage page"><button class="pin hot" type="button" aria-label="Note 4 by Rowan Vale, 0 replies" aria-expanded="false"><span class="face" aria-hidden="true" style="--face: var(--cm-face-0); --face-ink: var(--cm-face-0-ink); --av: var(--cm-av-0); --av-ink: var(--cm-av-0-ink);">RV</span></button></div><figcaption>Pointed from its row</figcaption></figure>
<figure><div class="stage page"><button class="pin lifted" type="button" aria-label="Note 4 by Kit Lowe, 0 replies" aria-expanded="false"><span class="face" aria-hidden="true" style="--face: var(--cm-face-2); --face-ink: var(--cm-face-2-ink); --av: var(--cm-av-2); --av-ink: var(--cm-av-2-ink);">KL</span></button></div><figcaption>Dragging</figcaption></figure>
<figure><div class="stage page"><button class="pin done" type="button" aria-label="Note 4 by Kit Lowe, resolved, 0 replies" aria-expanded="false"><span class="face" aria-hidden="true" style="--face: var(--cm-face-2); --face-ink: var(--cm-face-2-ink); --av: var(--cm-av-2); --av-ink: var(--cm-av-2-ink);">KL</span><span class="ok" aria-hidden="true"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5.5 12.5 4.2 4.2 8.8-9.4"></path></svg></span></span></button></div><figcaption>Resolved</figcaption></figure>
<figure><div class="stage page"><span class="plain"><span>Morning catch, </span><span class="quoted">laid out on ice</span></span></div><figcaption>Quoted words</figcaption></figure>
<figure><div class="stage page"><span class="target">Host element<div class="wash on" aria-hidden="true"></div></span></div><figcaption>Target band</figcaption></figure>
</div>
